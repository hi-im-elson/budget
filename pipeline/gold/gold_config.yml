tables:
  dim_category:
    target_table: gold.dim_category
    columns:
      - name: "id"
        type: "INTEGER"
        constraints: "NOT NULL PRIMARY KEY"
      - name: "category"
        type: "VARCHAR(255)"
        constraints: "NOT NULL"
      - name: "subcategory"
        type: "VARCHAR(255)"

  dim_merchant:
    target_table: gold.dim_merchant
    payment_descriptions:
      amex_cobalt:
        - "MEMBERSHIP FEE INSTALLMENT"
        - "PAYMENT RECEIVED - THANK YOU"
        - "Use Points for Purchases"
      rbc_mastercard:
        - "PAYMENT - THANK YOU / PAI EMENT - MERCI"
      rbc_chequing: []
      wealthsimple_cash: []
    columns:
      - name: "id"
        type: "VARCHAR(255)"
        constraints: "NOT NULL PRIMARY KEY"
      - name: "source"
        type: "VARCHAR(255)"
        constraints: "NOT NULL"
      - name: "merchant"
        type: "VARCHAR(255)"
      - name: "is_subscription"
        type: "BOOLEAN"
        constraints: "NOT NULL DEFAULT FALSE"
      - name: "category_id"
        type: "INTEGER"
      - name: "parent_id"
        type: "VARCHAR(255)"

  dim_source:
    target_table: gold.dim_source
    columns:
      - name: "source"
        type: "VARCHAR(255)"
        constraints: "NOT NULL PRIMARY KEY"
      - name: "last_transaction_date"
        type: "DATE"
        constraints: "NOT NULL"
      - name: "last_updated"
        type: "TIMESTAMP"
        constraints: "NOT NULL"

  dim_transaction_type:
    target_table: gold.dim_transaction_type
    columns:
      - name: "type_code"
        type: "VARCHAR(50)"
        constraints: "NOT NULL PRIMARY KEY"
      - name: "direction"
        type: "VARCHAR(20)"
        constraints: "NOT NULL"
      - name: "type_name"
        type: "VARCHAR(100)"
        constraints: "NOT NULL"
      - name: "description"
        type: "VARCHAR(255)"

  fact_transactions:
    target_table: gold.fact_transactions
    columns:
      - name: "id"
        type: "VARCHAR"
        constraints: "NOT NULL PRIMARY KEY"
      - name: "transaction_date"
        type: "DATE"
        constraints: "NOT NULL"
      - name: "source"
        type: "VARCHAR"
        constraints: "NOT NULL"
      - name: "merchant_id"
        type: "VARCHAR"
      - name: "type_code"
        type: "VARCHAR"
        constraints: "NOT NULL"
      - name: "description"
        type: "VARCHAR"
      - name: "amount"
        type: "DECIMAL(10,2)"
        constraints: "NOT NULL"
      - name: "direction"
        type: "VARCHAR(20)"
        constraints: "NOT NULL"
      - name: "category_id"
        type: "INTEGER"
      - name: "recipient_name"
        type: "VARCHAR"
      - name: "currency"
        type: "VARCHAR(3)"
        constraints: "DEFAULT 'CAD'"
      - name: "source_id"
        type: "UBIGINT"
        constraints: "NOT NULL"
      - name: "transfer_pair_id"
        type: "VARCHAR"
        constraints: ""   # nullable — NULL means not part of a matched transfer pair

  bridge_transfer_pairs:
    target_table: gold.bridge_transfer_pairs
    columns:
      - name: "pair_id"
        type: "VARCHAR"
        constraints: "NOT NULL PRIMARY KEY"
      - name: "outbound_id"
        type: "VARCHAR"
        constraints: "NOT NULL"
      - name: "inbound_id"
        type: "VARCHAR"
        constraints: "NOT NULL"
      - name: "outbound_source"
        type: "VARCHAR"
        constraints: "NOT NULL"
      - name: "inbound_source"
        type: "VARCHAR"
        constraints: "NOT NULL"
      - name: "amount"
        type: "DECIMAL(10,2)"
        constraints: "NOT NULL"
      - name: "outbound_date"
        type: "DATE"
        constraints: "NOT NULL"
      - name: "inbound_date"
        type: "DATE"
        constraints: "NOT NULL"
      - name: "confidence"
        type: "VARCHAR(10)"
        constraints: "NOT NULL"
      - name: "match_reason"
        type: "VARCHAR(255)"
        constraints: "NOT NULL"
