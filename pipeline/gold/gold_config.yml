tables:
  dim_category:
    target_table: gold.dim_category
    columns:
      - name: "id"
        type: "INTEGER"
        constraints: "NOT NULL PRIMARY KEY"
      - name: "category"
        type: "VARCHAR(255)"
        constraints: "NOT NULL"
      - name: "subcategory"
        type: "VARCHAR(255)"

  dim_merchant:
    target_table: gold.dim_merchant
    columns:
      - name: "merchant_key"
        type: "VARCHAR(255)"
        constraints: "NOT NULL PRIMARY KEY"
      - name: "merchant_name"
        type: "VARCHAR(255)"
      - name: "default_category"
        type: "VARCHAR(255)"
      - name: "transaction_count"
        type: "BIGINT"
      - name: "last_seen"
        type: "DATE"

  dim_source:
    target_table: gold.dim_source
    columns:
      - name: "source"
        type: "VARCHAR(255)"
        constraints: "NOT NULL PRIMARY KEY"
      - name: "last_transaction_date"
        type: "DATE"
        constraints: "NOT NULL"
      - name: "last_updated"
        type: "TIMESTAMP"
        constraints: "NOT NULL"

  dim_transaction_type:
    target_table: gold.dim_transaction_type
    columns:
      - name: "type_code"
        type: "VARCHAR(50)"
        constraints: "NOT NULL PRIMARY KEY"
      - name: "direction"
        type: "VARCHAR(20)"
        constraints: "NOT NULL"
      - name: "type_name"
        type: "VARCHAR(100)"
        constraints: "NOT NULL"
      - name: "description"
        type: "VARCHAR(255)"

  fact_transactions:
    target_table: gold.fact_transactions
    columns:
      - name: "id"
        type: "VARCHAR"
        constraints: "NOT NULL PRIMARY KEY"
      - name: "transaction_date"
        type: "DATE"
        constraints: "NOT NULL"
      - name: "source"
        type: "VARCHAR"
        constraints: "NOT NULL"
      - name: "description"
        type: "VARCHAR"
      - name: "amount"
        type: "DECIMAL(10,2)"
        constraints: "NOT NULL"
      - name: "direction"
        type: "VARCHAR(20)"
        constraints: "NOT NULL"
      - name: "type_code"
        type: "VARCHAR"
      - name: "category_id"
        type: "INTEGER"
      - name: "category_name"
        type: "VARCHAR"
      - name: "matched_by"
        type: "VARCHAR"
        constraints: "NOT NULL"
      - name: "confidence"
        type: "DECIMAL(5,4)"
        constraints: "NOT NULL DEFAULT 1.0"
      - name: "source_id"
        type: "UBIGINT"
        constraints: "NOT NULL"
      - name: "transfer_pair_id"
        type: "VARCHAR"
        constraints: ""   # nullable — NULL means not part of a matched transfer pair

  bridge_transfer_pairs:
    target_table: gold.bridge_transfer_pairs
    columns:
      - name: "pair_id"
        type: "VARCHAR"
        constraints: "NOT NULL PRIMARY KEY"
      - name: "outbound_id"
        type: "VARCHAR"
        constraints: "NOT NULL"
      - name: "inbound_id"
        type: "VARCHAR"
        constraints: "NOT NULL"
      - name: "outbound_source"
        type: "VARCHAR"
        constraints: "NOT NULL"
      - name: "inbound_source"
        type: "VARCHAR"
        constraints: "NOT NULL"
      - name: "amount"
        type: "DECIMAL(10,2)"
        constraints: "NOT NULL"
      - name: "outbound_date"
        type: "DATE"
        constraints: "NOT NULL"
      - name: "inbound_date"
        type: "DATE"
        constraints: "NOT NULL"
      - name: "confidence"
        type: "VARCHAR(10)"
        constraints: "NOT NULL"
      - name: "match_reason"
        type: "VARCHAR(255)"
        constraints: "NOT NULL"
