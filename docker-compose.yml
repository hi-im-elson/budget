services:
  duckdb-processor:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./pipeline:/app/pipeline
      - ./scripts:/app/scripts
      - ./resources:/app/resources
    environment:
      - DUCKDB_DATABASE=/app/data/budget.db
      - POSTGRES_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - TZ=America/Toronto
    command:
      - /bin/bash
      - -c
      - "/app/scripts/entrypoint.sh && tail -f /dev/null"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./api:/app/api
      - ./pipeline:/app/pipeline
      - ./resources:/app/resources
    environment:
      - DUCKDB_DATABASE=/app/data/budget.db
      - POSTGRES_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - TZ=America/Toronto
    ports:
      - "8000:8000"
    command: [ "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000" ]

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  postgres-backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      sh -c "
        mkdir -p /backups &&
        while true; do
          FILENAME=/backups/budget_$$(date +%Y%m%d_%H%M%S).sql &&
          pg_dump -h postgres -U $${POSTGRES_USER} $${POSTGRES_DB} > $$FILENAME &&
          echo 'Backup written: '$$FILENAME &&
          find /backups -name '*.sql' -mtime +7 -delete &&
          echo 'Old backups pruned (>7 days)' &&
          sleep 86400
        done
      "
    volumes:
      - ./backups:/backups
    restart: unless-stopped

volumes:
  postgres_data:
